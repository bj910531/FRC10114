let current=[],answers={},graded=false;const $=id=>document.getElementById(id);function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function start(){current=shuffle(bank).slice(0,10).map(([q,opts,correct,why])=>{let options=shuffle(opts.map((text,i)=>({text,good:i===correct})));return {q,options,why}});answers={};graded=false;$('result').innerHTML='';$('status').textContent='本回合：10 題，每題 10 分｜含犯規判定情境題';$('submit').disabled=false;render();window.scrollTo({top:0,behavior:'smooth'})}function render(){let html='';current.forEach((item,i)=>{html+=`<section class="card"><h3>${i+1}. ${item.q}</h3>`;item.options.forEach((o,j)=>{const chosen=answers[i]===j;html+=`<label class="opt"><input type="radio" name="q${i}" value="${j}" ${chosen?'checked':''} ${graded?'disabled':''}>${'ABCD'[j]}. ${o.text}</label>`});if(graded){let correct=item.options.findIndex(o=>o.good);let good=answers[i]===correct;html+=`<div class="explain"><strong class="${good?'correct':'wrong'}">${good?'✓ 答對':'✗ 答錯'}</strong><div>正確答案：${'ABCD'[correct]}. ${item.options[correct].text}</div><div>解析：${item.why}</div></div>`}html+='</section>'});$('questions').innerHTML=html;if(!graded)document.querySelectorAll('input[type=radio]').forEach(input=>input.addEventListener('change',e=>{answers[Number(e.target.name.slice(1))]=Number(e.target.value);update()}));update()}function update(){$('counter').textContent=graded?'已完成':`已作答 ${Object.keys(answers).length} / 10`}$('submit').addEventListener('click',()=>{if(Object.keys(answers).length<10){alert('請先完成全部 10 題再提交。');return}graded=true;let n=current.reduce((sum,q,i)=>sum+(q.options[answers[i]].good?1:0),0);$('result').innerHTML=`<div class="result"><h2>測驗完成：${n*10} 分</h2><p>答對 ${n} 題／共 10 題。下方可查看逐題解析。</p></div>`;$('submit').disabled=true;$('status').textContent='測驗結果';render();window.scrollTo({top:0,behavior:'smooth'})});$('restart').addEventListener('click',start);start();
